<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chatbot Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Styles: everything is served from this project, no third-party CDNs -->
    <link rel="stylesheet" type="text/css" href="static/css/materialize.min.css" />
    <link rel="stylesheet" type="text/css" href="static/css/style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Modal for rendering the charts -->
      <div id="modal1" class="modal">
        <canvas id="modal-chart"></canvas>
      </div>

      <!-- chatbot widget -->
      <div class="widget" role="dialog" aria-label="Chat">
        <div class="chat_header">
          <!-- bot name is filled from config.js -->
          <span class="chat_header_title"></span>
          <span
            class="dropdown-trigger"
            data-target="dropdown1"
            role="button"
            tabindex="0"
            aria-haspopup="true"
          >
            <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
            </svg>
          </span>

          <!-- Dropdown menu -->
          <ul id="dropdown1" class="dropdown-content">
            <li><a href="#" id="clear">Clear</a></li>
            <li><a href="#" id="restart">Restart</a></li>
            <li><a href="#" id="close">Close</a></li>
          </ul>
        </div>

        <!-- Chat log -->
        <div class="chats" id="chats" role="log" aria-live="polite" aria-relevant="additions">
          <div class="clearfix"></div>
        </div>

        <!-- keypad for user to type the message -->
        <div class="keypad">
          <textarea
            id="userInput"
            placeholder="Type a message..."
            class="usrInput"
            rows="1"
            aria-label="Message"
          ></textarea>
          <div id="sendButton" role="button" tabindex="0">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- launcher button -->
      <div class="profile_div" id="profile_div" role="button" tabindex="0" aria-expanded="false">
        <img class="imgProfile" src="static/img/botAvatar.png" alt="" />
      </div>

      <!-- Bot pop-up intro, text is filled from config.js -->
      <div class="tap-target" data-target="profile_div">
        <div class="tap-target-content">
          <h5 class="white-text"></h5>
          <p class="white-text"></p>
        </div>
      </div>
    </div>

    <!--
      Scripts are plain tags in dependency order so load order is deterministic.
      Libraries first, then config, then shared helpers, then components, then bootstrap.
    -->
    <script src="static/js/lib/jquery.min.js"></script>
    <script src="static/js/lib/materialize.min.js"></script>
    <script src="static/js/lib/uuid.min.js"></script>
    <script src="static/js/lib/chart.min.js"></script>
    <script src="static/js/lib/showdown.min.js"></script>
    <script src="static/js/lib/purify.min.js"></script>

    <!-- Edit config.js (or define window.CHATBOT_CONFIG before it) to configure the widget -->
    <script src="static/js/config.js"></script>

    <script src="static/js/components/utils.js"></script>
    <script src="static/js/components/botTyping.js"></script>
    <script src="static/js/components/charts.js"></script>
    <script src="static/js/components/cardsCarousel.js"></script>
    <script src="static/js/components/collapsible.js"></script>
    <script src="static/js/components/dropDown.js"></script>
    <script src="static/js/components/location.js"></script>
    <script src="static/js/components/pdfAttachment.js"></script>
    <script src="static/js/components/quickReplies.js"></script>
    <script src="static/js/components/suggestionButtons.js"></script>
    <script src="static/js/components/chat.js"></script>
    <script src="static/js/script.js"></script>
  </body>
</html>
