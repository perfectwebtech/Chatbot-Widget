name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    name: widget (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size
        run: |
          for f in dist/chatbot-widget.es.js dist/chatbot-widget.iife.js dist/chunks/*.js; do
            printf '%8s bytes gzip  %s\n' "$(gzip -c "$f" | wc -c)" "$f"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-dist
          path: |
            widget/dist
            widget/playwright-report
          if-no-files-found: ignore
